name: Veracode Security Scan

# Builds the Java application and runs a Veracode Static Analysis (SAST)
# pipeline scan on the built JAR, then fails the check on High / Very High
# findings. We build and scan the JAR ourselves (Veracode's "manual packaging"
# path) because the org auto-packager cannot build this Gradle project and
# falls back to scanning only the JavaScript, which finds nothing. Only SAST
# runs here — the Secrets and SCA scans are intentionally DISABLED.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # SAST — Veracode Static Analysis (Pipeline Scan). ENABLED, gating.
  # ---------------------------------------------------------------------------
  sast:
    name: Veracode SAST (Pipeline Scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build application artifact
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar --no-daemon

      # Call the Veracode pipeline scanner JAR directly rather than via
      # veracode/Veracode-pipeline-scan-action: that action mishandles the
      # fail_on_severity value (it splits the multi-word value on spaces and
      # the scan crashes) and ignores fail_on_cwe. Invoking the JAR ourselves
      # lets us pass -fs correctly. We fail on Medium and above so the app's
      # findings (the Medium XSS and hard-coded credentials, plus any
      # introduced High/Very High injection) surface as a failing check.
      # The scanner exits non-zero when a finding meets the fail criteria.
      - name: Run Veracode Static Analysis Pipeline Scan
        env:
          VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
          VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
        run: |
          set -euo pipefail
          curl -fsSO https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip
          unzip -o pipeline-scan-LATEST.zip pipeline-scan.jar
          JAR="$(ls build/libs/*.jar | head -n1)"
          # Strip any surrounding whitespace/newline the stored secret may carry
          # (the API id must be exactly 32 chars).
          VID="$(printf '%s' "$VERACODE_API_ID" | tr -d '[:space:]')"
          VKEY="$(printf '%s' "$VERACODE_API_KEY" | tr -d '[:space:]')"
          echo "Scanning artifact: $JAR"
          java -jar pipeline-scan.jar \
            -vid "$VID" \
            -vkey "$VKEY" \
            -f "$JAR" \
            -fs "Very High, High, Medium"

  # ---------------------------------------------------------------------------
  # SCA — Veracode Software Composition Analysis. DISABLED.
  # Re-enable by changing `if: false` to `if: true` (or removing the guard).
  # ---------------------------------------------------------------------------
  sca:
    name: Veracode SCA
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Veracode SCA (Agent-Based) scan
        uses: veracode/veracode-sca@v1
        env:
          SRCCLR_API_TOKEN: ${{ secrets.SRCCLR_API_TOKEN }}
        with:
          create-issues: false

  # ---------------------------------------------------------------------------
  # Secrets — Veracode secrets scanning. DISABLED.
  # Re-enable by changing `if: false` to `if: true` (or removing the guard).
  # ---------------------------------------------------------------------------
  secrets:
    name: Veracode Secrets Scan
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Veracode CLI
        run: |
          curl -fsS https://tools.veracode.com/veracode-cli/install | sh

      - name: Run Veracode secrets scan
        env:
          VERACODE_API_KEY_ID: ${{ secrets.VERACODE_API_ID }}
          VERACODE_API_KEY_SECRET: ${{ secrets.VERACODE_API_KEY }}
        run: |
          ./veracode scan --type directory --source . --scan-type secrets
