name: Veracode Security Scan

# Runs a Veracode Static Analysis (SAST) pipeline scan on every pull request
# and fails the check when findings are present. Only SAST runs — the Secrets
# and SCA scans are intentionally DISABLED.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # SAST — Veracode Static Analysis (Pipeline Scan). ENABLED, gating.
  # ---------------------------------------------------------------------------
  sast:
    name: Veracode SAST (Pipeline Scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build application artifact
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar --no-daemon

      # Call the Veracode pipeline scanner JAR directly rather than via
      # veracode/Veracode-pipeline-scan-action: that action mishandles the
      # fail_on_severity value (it splits "Very High, High" on spaces and the
      # scan crashes) and ignores fail_on_cwe. Invoking the JAR ourselves lets
      # us pass -fs "Very High, High" correctly, so the app's pre-existing
      # Medium findings don't fail the gate but an introduced High/Very High
      # vuln (e.g. SQL injection, command injection) does. The scanner exits
      # non-zero when a finding meets the fail criteria, which fails the job.
      - name: Run Veracode Static Analysis Pipeline Scan
        env:
          VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
          VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
        run: |
          set -euo pipefail
          curl -fsSO https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip
          unzip -o pipeline-scan-LATEST.zip pipeline-scan.jar
          JAR="$(ls build/libs/*.jar | head -n1)"
          echo "Scanning artifact: $JAR"
          java -jar pipeline-scan.jar \
            -vid "$VERACODE_API_ID" \
            -vkey "$VERACODE_API_KEY" \
            -f "$JAR" \
            -fs "Very High, High"

  # ---------------------------------------------------------------------------
  # SCA — Veracode Software Composition Analysis. DISABLED.
  # Re-enable by changing `if: false` to `if: true` (or removing the guard).
  # ---------------------------------------------------------------------------
  sca:
    name: Veracode SCA
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Veracode SCA (Agent-Based) scan
        uses: veracode/veracode-sca@v1
        env:
          SRCCLR_API_TOKEN: ${{ secrets.SRCCLR_API_TOKEN }}
        with:
          create-issues: false

  # ---------------------------------------------------------------------------
  # Secrets — Veracode secrets scanning. DISABLED.
  # Re-enable by changing `if: false` to `if: true` (or removing the guard).
  # ---------------------------------------------------------------------------
  secrets:
    name: Veracode Secrets Scan
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Veracode CLI
        run: |
          curl -fsS https://tools.veracode.com/veracode-cli/install | sh

      - name: Run Veracode secrets scan
        env:
          VERACODE_API_KEY_ID: ${{ secrets.VERACODE_API_ID }}
          VERACODE_API_KEY_SECRET: ${{ secrets.VERACODE_API_KEY }}
        run: |
          ./veracode scan --type directory --source . --scan-type secrets
